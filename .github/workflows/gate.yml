# Example: run relgate as a release gate against a service you start in CI.
# This is a template — adapt the "start your service" step to your app.
name: relgate

on:
  workflow_dispatch:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go build -o relgate ./cmd/relgate

